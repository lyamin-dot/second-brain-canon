<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap">
<style>

:root{--bg:#f6f7f8;--panel:#ffffff;--fg:#1d2327;--mute:#5d6870;--line:#d9dee2;--accent:#1f5f7a;--accent-fg:#ffffff;--mark:#fbe9a8;--chip:#e9eef1;

:root[data-theme="dark"]{--bg:#14191d;--panel:#1b2227;--fg:#e6eaec;--mute:#93a0a8;--line:#2d373d;--accent:#6fb7d3;--accent-fg:#0d1417;--mark:#5a4b12;--chip:#252e34;color-scheme:dark}

input:focus-visible,select:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid{display:grid;grid-template-columns:230px minmax(0,1fr);gap:20px;align-items:start}

.topics{display:flex;flex-direction:column;gap:2px;max-height:70vh;overflow:auto}

.t{display:flex;justify-content:space-between;gap:8px;text-align:left;padding:6px 10px;border:1px solid transparent;border-radius:6px;background:none;color:var(--fg);font:inherit;cursor:pointer}

ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}

.meta span{overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tag{background:var(--chip);border-radius:4px;padding:1px 7px;font-size:12px}

mark{background:var(--mark);color:inherit;border-radius:2px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:16px;border-bottom:1px solid var(--line)}
.tab{padding:8px 14px;border:0;border-bottom:2px solid transparent;background:none;color:var(--mute);font:inherit;cursor:pointer}
.tab[aria-selected=true]{color:var(--fg);border-bottom-color:var(--accent)}

.st-read{background:#dceee0;color:#1f4d2b}.st-worked{background:#cfe3f0;color:#173b52}

:root[data-theme="dark"] .st-read{background:#23402b;color:#cfe8d5}:root[data-theme="dark"] .st-worked{background:#1d3a4d;color:#cfe3f0}

.btn:disabled{opacity:.5;cursor:default}
.warn{color:#9a3b1c}
</style><style>

<div class="wrap">

<script>

 var h='<button class="t" data-t="" aria-pressed="'+(st.topic===''?'true':'false')+'">Все темы<b>'+all+'</b></button>';
 tnames.forEach(function(t){h+='<button class="t" data-t="'+esc(t)+'" aria-pressed="'+(st.topic===t?'true':'false')+'">'+esc(t)+'<b>'+topicCount[t]+'</b></button>'});
 var none=DATA.filter(function(d){return d.d!=='personal'&&!d.tp.length}).length;

 el.innerHTML=h}

function head(d){return(d.n+' '+d.t+' '+(d.au||'')+' '+(d.src||'')).toLowerCase()}
function render(){
 var qq=st.q.toLowerCase().trim().replace(/\s+/g,' ');var words=qq.indexOf(' ')>0&&SYN.some(function(g){return g.some(function(t){return t.indexOf(qq)===0||qq.indexOf(t)===0&&t.indexOf(' ')>0})})?[qq]:qq.split(' ').filter(function(w){return w&&STOP.indexOf(w)<0});if(!words.length&&qq)words=qq.split(' ');var AL=words.map(alts);var hw=[].concat.apply([],AL);var ALR=AL.map(function(al){return al.map(mre)});
 var hits=[];
 DATA.forEach(function(d){
  if(!visible(d))return;

  var nn=NOTES[d.h]||{},ns=nn.status||'',nc=(nn.comments||[]);if(st.nf){if(st.nf==='none'?ns:(st.nf==='cm'?!nc.length:ns!==st.nf))return}
  var hd=head(d),body=(d.x+' '+d.ft).toLowerCase(),note=nc.map(function(c){return c.text}).join(' ').toLowerCase(),score=0;
  for(var k=0;k<words.length;k++){var rs=ALR[k];var inH=rs.some(function(r){return cnt(hd,r)>0}),inN=rs.some(function(r){return cnt(note,r)>0}),nb=0;rs.forEach(function(r){nb+=cnt(body,r)});
   if(inH)score+=1000;else if(inN)score+=500;else if(nb)score+=Math.min(nb,20);else return}
  d._s=score;hits.push(d)});
 var seen={},out=[];hits.forEach(function(d){var key=d.dc||d.h;if(seen[key]){seen[key].cp.push(d)}else{d.cp=[];seen[key]=d;out.push(d)}});
 out.sort(function(a,b){if(words.length&&b._s!==a._s)return b._s-a._s;var ya=a.y||'0000',yb=b.y||'0000';return yb.localeCompare(ya)});
 var pers=st.dt==='personal'?'':' Личные документы ('+META.personal+') в поиск не входят: выберите тип «Личные документы».';
 document.getElementById('cnt').textContent=(hw.length>words.length?'Искал также: '+hw.filter(function(w){return words.indexOf(w)<0}).join(', ')+'. ':'')+'Найдено: '+out.length+(hits.length>out.length?' (копий свёрнуто: '+(hits.length-out.length)+')':'')+'.'+(words.length?' Сначала совпадения в названии и авторах, затем в ваших комментариях, затем по числу упоминаний в тексте; короткие слова (до 5 букв) ищутся только с начала слова.':' По году, новые сверху.')+pers+(out.length>LIMIT?' Показаны первые '+LIMIT+'.':'');
 var h=out.slice(0,LIMIT).map(function(d){

  var snip=d.x;if(words.length&&inText){var all=(d.x+' '+d.ft),low=all.toLowerCase(),p=-1;hw.some(function(w){p=low.indexOf(w);return p>=0});if(p>=0)snip='…'+all.slice(Math.max(0,p-150),p+350)+'…'}
  var snippet=snip?'<details'+(inText?' open':'')+'><summary>Текст первых страниц</summary><p class="snip">'+hl(snip,hw)+'</p></details>':'';

  var L=glink(d),ttl=hl(d.t,hw);
  var hint='';
  if(d.nt)hint='<div class="hint">Текста первых страниц нет или он нечитаем: файл находится только по названию и имени.</div>';
  if(d.d==='book')hint='<div class="hint">Книга целиком: в поиск входит только текст титульных страниц, содержание книги не ищется.</div>';
  if(d.d==='chapter'&&d.bk)hint='<div class="hint">Часть книги «'+esc((BYISBN[d.bk.isbn]||{}).title||'')+'». <button class="lnk" data-book="'+esc(d.bk.isbn)+'">Открыть книгу по главам</button></div>';
  return'<li><div class="ti">'+(L?'<a href="'+L+'" target="_blank" rel="noopener" title="Открыть файл на Google Диске">'+ttl+'</a>':ttl)+'</div>'
   +(d.au||d.src?'<div class="au">'+hl([d.au,d.src].filter(Boolean).join(' · '),hw)+'</div>':'')
   +'<div class="meta"><span>'+esc(DT[d.d]||d.d)+'</span>'+(yr?'<span>'+yr+'</span>':'<span>год не определён</span>')+(d.p?'<span>'+esc(d.p)+' стр.</span>':'')+'<span>'+esc(d.f||'')+'\\'+esc(d.n)+'.pdf</span>'+(d.cp.length?'<span>ещё копий: '+d.cp.length+'</span>':'')+(d.doi?'<span>DOI '+esc(d.doi)+'</span>':'')+'</div>'
   +(d.tp.length?'<div class="tags">'+d.tp.map(function(t){return'<span class="tag">'+esc(t)+'</span>'}).join('')+'</div>':'')+hint+snippet+noteBlock(d)+'</li>'}).join('');
 if(out.length>LIMIT)h+='<li class="more" style="border:0;background:none"><button class="btn" id="more">Показать ещё '+Math.min(200,out.length-LIMIT)+'</button></li>';
 document.getElementById('res').innerHTML=h||'<li class="empty">Ничего не найдено. Уберите часть слов, смените тему или тип. Пустой ответ не значит, что этого нет в архиве: поиск видит только первые страницы.</li>'}
var TABS=[['search','Поиск'],['book','Книги'],['guide','Руководства'],['mm','Мои отметки']];
function showTab(id){TABS.forEach(function(x){document.getElementById('v-'+x[0]).hidden=(x[0]!==id)});
 document.getElementById('tabs').innerHTML=TABS.map(function(x){return'<button class="tab" role="tab" data-tab="'+x[0]+'" aria-selected="'+(x[0]===id)+'">'+x[1]+'</button>'}).join('');
 try{localStorage.setItem('ar-tab',id)}catch(e){}}
var VAR={short:'краткая версия',long:'полная версия',addendum:'дополнение'};function VV(g){return VAR[g]||'основной документ'}
function fileRow(d,extra){var L=glink(d);return'<div class="row"><span class="y">'+esc(d.y||'—')+'</span>'+(L?'<a href="'+L+'" target="_blank" rel="noopener">'+esc(d.n)+'</a>':'<span>'+esc(d.n)+'</span>')+'<span class="old">'+esc(d.f)+'</span>'+(d.p?'<span class="old">'+esc(d.p)+' стр.</span>':'')+(extra||'')+'</div>'}
function buildGuide(){
 var g=DATA.filter(function(d){return d.d==='guideline'});var by={};
 g.forEach(function(d){var k=d.aw?'AWMF '+d.aw:(d.fam||'Прочие руководства');(by[k]=by[k]||[]).push(d)});
 var keys=Object.keys(by).sort(function(a,b){var pa=a.indexOf('Прочие')===0,pb=b.indexOf('Прочие')===0;return pa!==pb?(pa?1:-1):a.localeCompare(b)});
 var h='<div class="cnt">Руководств и рекомендаций: '+g.length+', групп: '+keys.length+'. Группа — номер реестра AWMF, а без номера — одно и то же руководство по названию. «Свежая» — файл с самым поздним годом; если таких файлов несколько, версия не определена и помечена. Главы книг сюда не входят. Метка «новейшая в архиве» значит только, что новее в вашем архиве нет; действует ли это издание, архив не знает. Известные более новые издания вне архива названы в группе (проверено '+fmtDate(META.checked)+'). Имя файла — ссылка на Google Диск.</div>';
 keys.forEach(function(k){var a=by[k].slice().sort(function(x,y){return (y.y||'0').localeCompare(x.y||'0')});var seenAll={};var top=a[0].y;var seenC={};var tops=a.filter(function(d){if(d.y!==top)return false;var c=d.dc||d.h;if(seenC[c]){d._cp=1;return false}seenC[c]=1;d._cp=0;return true}),nTop=tops.length,vset={};tops.forEach(function(d){vset[VV(d.gv)]=1});var variants=nTop>1&&Object.keys(vset).length===nTop;

 BOOKS.forEach(function(b,bi){

function buildMM(){

 if(NSTATE==='ok'){var keys=Object.keys(NOTES).filter(function(k){return BYH[k]});

   h+='<div class="grp"><h3>'+g[1]+' ('+ks.length+')</h3>'+(ks.length?ks.map(function(k){var d=BYH[k][0],n=NOTES[k];return fileRow(d,'<span>'+esc(d.t.slice(0,90))+'</span>'+(n.statusAt?'<span class="old">'+fmtD(n.statusAt)+'</span>':'')+((n.comments||[]).length?'<span class="old">комментариев: '+n.comments.length+'</span>':''))}).join(''):'<div class="old">пока нет</div>')+'</div>'});

   return'<div class="row"><span>'+esc(n.title||k)+'</span><span class="old">'+esc(n.path||'')+'</span>'+(n.status?'<span class="tag st-'+esc(n.status)+'">'+SL[n.status]+'</span>':'')+((n.comments||[]).length?'<span class="old">комментариев: '+n.comments.length+'</span>':'')

  h+='<button class="btn" id="expd">Сохранить копию на Google Диск</button> <button class="btn" id="exp">Скачать копию (JSON)</button> <span class="old" id="expmsg"></span><div class="old">Копия на Диск ложится в папку «Projekt archive-recon» отдельным файлом с датой; прежние копии не перезаписываются.</div>'}

function normT(s){return String(s||'').toLowerCase().replace(/\s+/g,' ').trim()}

async function reattach(oldH,newH){var o=NOTES[oldH],n=NOTES[newH]||{};var f=baseFields(newH);
 var useOld=(o.statusAt||'')>(n.statusAt||'');f.status=useOld?(o.status||''):(n.status||o.status||'');f.statusBy=useOld?o.statusBy||null:(n.statusBy||o.statusBy||null);f.statusAt=useOld?o.statusAt||null:(n.statusAt||o.statusAt||null);
 f.comments=(n.comments||[]).concat(o.comments||[]);await ndoc(newH).set(f);await ndoc(oldH).delete()}

function ndoc(h){return DB.doc('notes/'+h)}

 if(!s&&!f.comments.length){await ndoc(h).delete()}else await ndoc(h).set(f)}
async function addComment(h,text){var n=NOTES[h]||{};var f=baseFields(h);f.status=n.status||'';f.statusBy=n.statusBy||null;f.statusAt=n.statusAt||null;
 f.comments=(n.comments||[]).concat([{id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),text:text,by:ME,at:new Date().toISOString()}]);await ndoc(h).set(f)}

  .catch(function(err){var c=err&&err.code;m.textContent=c==='server_not_connected'?'Google Drive не подключён в claude.ai (Настройки → Connectors)':c==='not_in_manifest'||c==='approval_required'?'доступ к Диску для страницы не разрешён':'не удалось ('+(c||'ошибка')+(err&&err.message?': '+err.message:'')+')'}).finally(function(){b.disabled=false})});

   return dl.save({filename:'archive-recon-notes-'+new Date().toISOString().slice(0,10)+'.json',data:notesJSON()}).then(function(){m.textContent='готово'})}).catch(function(err){m.textContent=(err&&err.code==='declined')?'отменено':'не удалось ('+((err&&err.code)||'ошибка')+')'})})}
async function startNotes(){try{var w=window.claude;if(!w||!w.use){NSTATE='off';render();buildMM();return}
 var r=await Promise.all([w.use('db'),w.use('user')]);DB=r[0];var U=r[1];
 if(!DB){NSTATE='off';render();buildMM();return}
 if(U){try{ME=await U.id()}catch(e){}}
 DB.collection('notes').limit(1000).onSnapshot(async function(snap){var m={};snap.docs.forEach(function(s){var v=s.data();if(v)m[s.id]=v});NOTES=m;
  var ids={};Object.keys(m).forEach(function(k){var n=m[k];if(n.statusBy)ids[n.statusBy]=1;(n.comments||[]).forEach(function(c){if(c.by)ids[c.by]=1})});
  var need=Object.keys(ids).filter(function(i){return!NAMES[i]});
  if(U&&need.length){try{var ps=await U.profiles(need);need.forEach(function(i){var p=ps[i];if(p&&p.name)NAMES[i]=p.isMe?p.name+' (вы)':p.name})}catch(e){}}

  function(err){NSTATE='off';render();buildMM()})}catch(e){NSTATE='off';render();buildMM()}}
function boot(S){DATA=S.data;BOOKS=S.books;SYN=S.syn;WS=S.ws||[];OUTSIDE=S.outside||{};META=S.meta;
 BOOKS.forEach(function(b){BYISBN[b.isbn]=b});DATA.forEach(function(d){(BYH[d.h]=BYH[d.h]||[]).push(d)});

 document.getElementById('sub').textContent=META.files+' PDF из папки «'+META.folder+'» (опись '+fmtDate(META.scanned)+', страница собрана '+fmtDate(META.built)+'). Название ведёт к файлу на Google Диске. Темы присвоены по тексту первых страниц; без текста '+META.notext+' файлов. '+BOOKS.length+' книги собраны из '+nb+' файлов-глав. Отметки «прочитано» и комментарии привязаны к содержимому файла: у точных копий они общие и сохраняются при переносе файла в другую папку.';
 countTopics();buildTopics();

 fillSel('yr',yrs.map(function(x){return[x,x]}),'Все годы');
 wire();render();buildGuide();buildBook();buildMM();
